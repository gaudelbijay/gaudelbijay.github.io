document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

color:var(--accent);font-weight:600}\n  button.primary:hover{filter:brightness(1.08);color:#141005}\n  .btns{display:flex;gap:8px;flex-wrap:wrap}\n  .radio{display:flex;gap:6px}\n  .radio button.on{border-color:var(--cyan);color:var(--cyan)}\n  .eq{font-family:var(--mono);font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);\n      border-radius:10px;padding:14px 16px;overflow-x:auto;line-height:1.7}\n  .eq .c{color:var(--dim)}\n  .eq .hl{color:var(--accent)}\n  .mat{display:inline-grid;grid-template-columns:repeat(3,auto);gap:2px 12px;padding:6px 10px;margin:0 4px;\n       border-left:1.5px solid var(--dim);border-right:1.5px solid var(--dim);border-radius:6px;vertical-align:middle;\n       font-family:var(--mono);font-size:12px;text-align:right}\n  .mat span{min-width:52px}\n  .mat span.z{color:var(--faint,#5a6478)}\n  .readout{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}\n  .readout b{color:var(--cyan);font-weight:500}\n  .x{color:var(--ax)} .y{color:var(--ay)} .z{color:var(--az)} .w{color:var(--accent)}\n  .hero{padding-top:96px;border-bottom:1px solid var(--line)}\n  .hero p{max-width:64ch;font-size:16px}\n  .pill{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--cyan);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin-right:6px}\n  svg text{font-family:var(--mono)}\n  .note{font-size:13px;color:var(--dim);border-left:2px solid var(--accent);padding:2px 0 2px 12px;max-width:58ch}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<canvas id=\"gl\"><\u002Fcanvas>\n\n<nav>\n  <div class=\"brand\">SO(3) · 𝔰𝔬(3)<small>an interactive field guide<\u002Fsmall><\u002Fdiv>\n  <ol>\n    <li><a href=\"#act\"><span class=\"n\">01<\u002Fspan>Rotations as a group<\u002Fa><\u002Fli>\n    <li><a href=\"#noncomm\"><span class=\"n\">02<\u002Fspan>Order matters<\u002Fa><\u002Fli>\n    <li><a href=\"#ball\"><span class=\"n\">03<\u002Fspan>The π-ball &amp; ℝP³<\u002Fa><\u002Fli>\n    <li><a href=\"#so3\"><span class=\"n\">04<\u002Fspan>𝔰𝔬(3): skew matrices<\u002Fa><\u002Fli>\n    <li><a href=\"#exp\"><span class=\"n\">05<\u002Fspan>The exponential map<\u002Fa><\u002Fli>\n    <li><a href=\"#tangent\"><span class=\"n\">06<\u002Fspan>Tangent spaces<\u002Fa><\u002Fli>\n    <li><a href=\"#slerp\"><span class=\"n\">07<\u002Fspan>Geodesics &amp; slerp<\u002Fa><\u002Fli>\n    <li><a href=\"#bracket\"><span class=\"n\">08<\u002Fspan>Bracket = cross product<\u002Fa><\u002Fli>\n    <li><a href=\"#cover\"><span class=\"n\">09<\u002Fspan>Quaternion double cover<\u002Fa><\u002Fli>\n  <\u002Fol>\n<\u002Fnav>\n\n<main>\n<section class=\"hero\" id=\"top\">\n  <span class=\"kicker\">Lie groups for people who ship rotations<\u002Fspan>\n  <h1>SO(3) and its algebra 𝔰𝔬(3)<\u002Fh1>\n  <p><b>SO(3)<\u002Fb> is the set of all rigid rotations of 3-space — every attitude a spacecraft, camera, or robot wrist can have. It is a <b>group<\u002Fb> (rotations compose and invert), a <b>3-dimensional curved manifold<\u002Fb> (not a vector space!), and a <b>Lie group<\u002Fb> (composition is smooth). Its tangent space at the identity, <b>𝔰𝔬(3)<\u002Fb>, is the flat vector space of angular velocities — the thing your gyro measures.<\u002Fp>\n  <div class=\"eq\">SO(3) = { R ∈ ℝ³ˣ³ &nbsp;|&nbsp; RᵀR = I,&nbsp; det R = +1 } <span class=\"c\">&nbsp;· 9 numbers, 6 constraints → 3 DOF<\u002Fspan><\u002Fdiv>\n  <p style=\"margin-top:16px\">\n    <span class=\"pill\">drag every viewport<\u002Fspan>\n    <span class=\"pill\">x<\u002Fspan><span class=\"pill\" style=\"color:var(--ay)\">y<\u002Fspan><span class=\"pill\" style=\"color:var(--az)\">z<\u002Fspan>\n    <span class=\"pill\" style=\"color:var(--dim)\">axes colored r-g-b throughout<\u002Fspan>\n  <\u002Fp>\n<\u002Fsection>\n\n<section id=\"act\">\n  <span class=\"kicker\">01 · the group and its action<\u002Fspan>\n  <h2>A rotation is a matrix that acts on things<\u002Fh2>\n  <div class=\"row\">\n    <div class=\"panel\">\n      <p><b>Drag inside the viewport<\u002Fb> to rotate the probe (not the camera). Every drag <em>composes<\u002Fem> a small rotation onto the current one: R ← ΔR·R. The matrix below is the live attitude; note its columns are just the body axes <span class=\"x\">x̂<\u002Fspan><span class=\"y\">ŷ<\u002Fspan><span class=\"z\">ẑ<\u002Fspan> expressed in the world frame — always unit length, always orthogonal.<\u002Fp>\n      <div class=\"eq\">R = <span class=\"mat\" id=\"m-act\"><\u002Fspan><\u002Fdiv>\n      <div class=\"readout\"><span>det R = <b id=\"det-act\">1.000<\u002Fb><\u002Fspan><span>‖RᵀR − I‖ = <b id=\"orth-act\">0.000<\u002Fb><\u002Fspan><\u002Fdiv>\n      <div class=\"ctrl\"><div class=\"btns\">\n        <button data-pre=\"x\">⊕ Rx(90°)<\u002Fbutton><button data-pre=\"y\">⊕ Ry(90°)<\u002Fbutton><button data-pre=\"z\">⊕ Rz(90°)<\u002Fbutton>\n        <button data-pre=\"inv\">invert R⁻¹ = Rᵀ<\u002Fbutton><button data-pre=\"reset\">reset to I<\u002Fbutton>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"view\" id=\"v-act\"><span class=\"tag\">DRAG = COMPOSE ΔR·R<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"noncomm\">\n  <span class=\"kicker\">02 · non-commutativity<\u002Fspan>\n  <h2>Rotation order matters<\u002Fh2>\n  <div class=\"row rev\">\n    <div class=\"view\" id=\"v-nc\"><span class=\"tag\">LEFT: Ry·Rx — RIGHT: Rx·Ry<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\">\n      <p>Both probes start identical. The left one rotates 90° about <span class=\"x\">x<\u002Fspan> <em>then<\u002Fem> 90° about <span class=\"y\">y<\u002Fspan>; the right one does the same rotations in the opposite order. They end up in <b>different attitudes<\u002Fb> — SO(3) is non-abelian. This is why \"add the Euler angles\" is not a thing.<\u002Fp>\n      <div class=\"eq\">Ry(90°)·Rx(90°) ≠ Rx(90°)·Ry(90°)<br><span class=\"c\">failure to commute is measured by the Lie bracket → <a href=\"#bracket\">§08<\u002Fa><\u002Fspan><\u002Fdiv>\n      <div class=\"ctrl\"><div class=\"btns\"><button class=\"primary\" id=\"nc-play\">▶ play both sequences<\u002Fbutton><button id=\"nc-reset\">reset<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"ball\">\n  <span class=\"kicker\">03 · topology · axis–angle<\u002Fspan>\n  <h2>The solid ball of radius π &nbsp;(and why SO(3) = ℝP³)<\u002Fh2>\n  <div class=\"row\">\n    <div class=\"panel\">\n      <p>Every rotation is a turn by angle θ ∈ [0, π] about an axis <b>n̂<\u002Fb>. Plot the vector <b>θ·n̂<\u002Fb>: all of SO(3) fits in a solid ball of radius π. One subtlety: a turn of π about <b>n̂<\u002Fb> equals a turn of π about <b>−n̂<\u002Fb>, so <b>antipodal boundary points are the same rotation<\u002Fb> — glue them and you get real projective space ℝP³.<\u002Fp>\n      <div class=\"eq\">p = θ·n̂ ∈ B³(π), &nbsp; p ∼ −p on ∂B <span class=\"c\">→ SO(3) ≅ ℝP³<\u002Fspan><\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"cr\"><label>axis az<\u002Flabel><input type=\"range\" id=\"b-az\" min=\"-180\" max=\"180\" value=\"35\"><output id=\"o-b-az\">35°<\u002Foutput><\u002Fdiv>\n        <div class=\"cr\"><label>axis el<\u002Flabel><input type=\"range\" id=\"b-el\" min=\"-89\" max=\"89\" value=\"20\"><output id=\"o-b-el\">20°<\u002Foutput><\u002Fdiv>\n        <div class=\"cr\"><label>angle θ<\u002Flabel><input type=\"range\" id=\"b-th\" min=\"0\" max=\"180\" value=\"70\"><output id=\"o-b-th\">70°<\u002Foutput><\u002Fdiv>\n        <div class=\"btns\"><button class=\"primary\" id=\"b-loop\">▶ walk a loop through ∂B (spin 2π)<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"note\">During the loop the marker hits the boundary and <em>teleports<\u002Fem> to the antipode — but watch the probe: its motion is perfectly smooth. The jump is an artifact of the chart, not of the rotation.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"view\" id=\"v-ball\"><span class=\"tag\">BALL = SO(3) · MARKER = θ·n̂<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"so3\">\n  <span class=\"kicker\">04 · the lie algebra<\u002Fspan>\n  <h2>𝔰𝔬(3): skew-symmetric matrices = angular velocities<\u002Fh2>\n  <div class=\"row rev\">\n    <div class=\"view\" id=\"v-so3\"><span class=\"tag\">v = ω × r AT SAMPLE POINTS<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\">\n      <p>Differentiate RᵀR = I and you find Ṙ = Ω R with Ω <b>skew-symmetric<\u002Fb>: Ωᵀ = −Ω. These matrices form the Lie algebra 𝔰𝔬(3) — a flat 3-D vector space. The <b>hat map<\u002Fb> identifies it with ℝ³: the skew matrix ω̂ is just \"cross product with ω\". Set an angular velocity and watch each point of the body move with v = ω × r.<\u002Fp>\n      <div class=\"eq\">ω̂ = <span class=\"mat\" id=\"m-hat\"><\u002Fspan> , &nbsp; ω̂ r = ω × r<\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"cr\"><label class=\"x\">ω_x<\u002Flabel><input type=\"range\" id=\"w-x\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"0.6\"><output id=\"o-w-x\">0.60<\u002Foutput><\u002Fdiv>\n        <div class=\"cr\"><label class=\"y\">ω_y<\u002Flabel><input type=\"range\" id=\"w-y\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"1.2\"><output id=\"o-w-y\">1.20<\u002Foutput><\u002Fdiv>\n        <div class=\"cr\"><label class=\"z\">ω_z<\u002Flabel><input type=\"range\" id=\"w-z\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"0\"><output id=\"o-w-z\">0.00<\u002Foutput><\u002Fdiv>\n        <div class=\"readout\"><span>‖ω‖ = <b id=\"o-w-n\">1.34<\u002Fb> rad/s<\u002Fspan><span class=\"c\" style=\"color:#c65fd6\">— magenta arrow = ω<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"exp\">\n  <span class=\"kicker\">05 · algebra → group<\u002Fspan>\n  <h2>The exponential map &nbsp;exp: 𝔰𝔬(3) → SO(3)<\u002Fh2>\n  <div class=\"row\">\n    <div class=\"panel\">\n      <p>Integrate a constant angular velocity for time t and you get a rotation: <b>R(t) = exp(t ω̂)<\u002Fb>. The matrix exponential's series collapses (ω̂³ = −‖ω‖²ω̂) into the closed-form <b>Rodrigues formula<\u002Fb> — the workhorse of every robotics library. The traced path of the antenna tip is a circle: one-parameter subgroups of SO(3) are pure spins.<\u002Fp>\n      <div class=\"eq\">exp(θ K̂) = I + sin θ · K̂ + (1 − cos θ) · K̂² <span class=\"c\">&nbsp;(K̂ = ω̂/‖ω‖, θ = t‖ω‖)<\u002Fspan><\u002Fdiv>\n      <div class=\"eq\">R(t) = <span class=\"mat\" id=\"m-exp\"><\u002Fspan><\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"cr\"><label>t·‖ω‖<\u002Flabel><input type=\"range\" id=\"e-th\" min=\"0\" max=\"360\" value=\"0\"><output id=\"o-e-th\">0°<\u002Foutput><\u002Fdiv>\n        <div class=\"btns\"><button class=\"primary\" id=\"e-play\">▶ integrate<\u002Fbutton><button id=\"e-rand\">randomize axis<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"view\" id=\"v-exp\"><span class=\"tag\">R(t) = exp(t ω̂)<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"tangent\">\n  <span class=\"kicker\">06 · tangent space at R<\u002Fspan>\n  <h2>Velocity at any attitude: spatial vs body frame<\u002Fh2>\n  <div class=\"row rev\">\n    <div class=\"view\" id=\"v-tan\"><span class=\"tag\">CYAN = SPATIAL ω · ORANGE = BODY ω<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\">\n      <p>The tangent space at R ≠ I is T_R SO(3) = {ω̂ R} — every velocity is an angular velocity translated to R. There are two natural charts: <b>spatial<\u002Fb> ω̂ₛ = ṘRᵀ (world frame — what a motion-capture rig sees) and <b>body<\u002Fb> ω̂_b = RᵀṘ (attached frame — what the onboard IMU measures). Same tangent vector, two coordinates, related by ωₛ = R ω_b.<\u002Fp>\n      <div class=\"eq\">Ṙ = ω̂ₛ R = R ω̂_b &nbsp;&nbsp; <span class=\"c\">ωₛ = R ω_b<\u002Fspan><\u002Fdiv>\n      <div class=\"readout\"><span class=\"c\" style=\"color:var(--cyan)\">ωₛ (world) = <b id=\"o-ws\"><\u002Fb><\u002Fspan><span class=\"w\">ω_b (IMU) = <b id=\"o-wb\" style=\"color:var(--accent)\"><\u002Fb><\u002Fspan><\u002Fdiv>\n      <p class=\"note\">The trajectory here is a tumble: R(t) = Rz(0.8t)·Rx(0.9·sin t). The cyan arrow lives in the world frame; the orange arrow is glued to the probe and rides along with it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"slerp\">\n  <span class=\"kicker\">07 · geodesics<\u002Fspan>\n  <h2>Interpolating rotations: slerp, not lerp<\u002Fh2>\n  <div class=\"row\">\n    <div class=\"panel\">\n      <p>The shortest path in SO(3) from R₀ to R₁ is the geodesic <b>R(s) = R₀ exp(s·log(R₀ᵀR₁))<\u002Fb> — spin at constant angular velocity about one fixed axis (in quaternion form: <b>slerp<\u002Fb>). Averaging matrix <em>entries<\u002Fem> instead leaves the manifold: the \"matrix lerp\" probe shears and shrinks because (1−s)R₀ + sR₁ is not orthogonal.<\u002Fp>\n      <div class=\"eq\">geodesic: R(s) = R₀ exp(s·log(R₀ᵀR₁))<br><span class=\"c\">lerp: M(s) = (1−s)R₀ + sR₁ ∉ SO(3)<\u002Fspan> &nbsp; det M = <b class=\"hl\" id=\"o-det-lerp\">1.000<\u002Fb><\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"cr\"><label>s<\u002Flabel><input type=\"range\" id=\"s-s\" min=\"0\" max=\"1\" step=\"0.005\" value=\"0.35\"><output id=\"o-s-s\">0.35<\u002Foutput><\u002Fdiv>\n        <div class=\"radio\"><button id=\"s-slerp\" class=\"on\">geodesic (slerp)<\u002Fbutton><button id=\"s-lerp\">matrix lerp<\u002Fbutton><button id=\"s-both\">both<\u002Fbutton><\u002Fdiv>\n        <div class=\"btns\"><button class=\"primary\" id=\"s-play\">▶ sweep s: 0 → 1<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"view\" id=\"v-slerp\"><span class=\"tag\">GHOSTS = R₀, R₁ · TRACE = GEODESIC<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"bracket\">\n  <span class=\"kicker\">08 · the lie bracket<\u002Fspan>\n  <h2>The commutator is the cross product<\u002Fh2>\n  <div class=\"row rev\">\n    <div class=\"view\" id=\"v-brk\"><span class=\"tag\">e^(−εŷ) e^(−εx̂) e^(εŷ) e^(εx̂)<\u002Fspan><\u002Fdiv>\n    <div class=\"panel\">\n      <p>Rotate by ε about <span class=\"x\">x<\u002Fspan>, then ε about <span class=\"y\">y<\u002Fspan>, then undo both. If rotations commuted you'd be back where you started. You aren't: the residual is a second-order rotation about <span class=\"z\">z<\u002Fspan> — because the bracket of 𝔰𝔬(3) <b>is<\u002Fb> the cross product, and x̂ × ŷ = ẑ. This residual is exactly what makes gyro integration order-sensitive.<\u002Fp>\n      <div class=\"eq\">e^(−εŶ) e^(−εX̂) e^(εŶ) e^(εX̂) = e^(ε²[X̂,Ŷ]) + O(ε³)<br>[ω̂₁, ω̂₂] = ω̂₁ω̂₂ − ω̂₂ω̂₁ = (ω₁ × ω₂)^<\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"cr\"><label>ε<\u002Flabel><input type=\"range\" id=\"k-eps\" min=\"5\" max=\"60\" value=\"35\"><output id=\"o-k-eps\">35°<\u002Foutput><\u002Fdiv>\n        <div class=\"btns\"><button class=\"primary\" id=\"k-play\">▶ run the commutator<\u002Fbutton><\u002Fdiv>\n        <div class=\"readout\"><span>predicted residual ε² about <span class=\"z\">ẑ<\u002Fspan> = <b id=\"o-k-res\">21.4°<\u002Fb><\u002Fspan><span>measured = <b id=\"o-k-meas\">—<\u002Fb><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"note\">Ghost = starting attitude. After all four moves the probe fails to return to the ghost by a small twist about <span class=\"z\">z<\u002Fspan>.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"cover\">\n  <span class=\"kicker\">09 · topology, again<\u002Fspan>\n  <h2>SU(2) → SO(3): the 2-to-1 double cover<\u002Fh2>\n  <div class=\"row\">\n    <div class=\"panel\">\n      <p>Unit quaternions live on the 3-sphere S³ and map onto rotations by q ↦ R(q) — but <b>q and −q give the same rotation<\u002Fb>. Spin the probe one full turn (360°): it returns home, yet its quaternion travels only <em>half<\u002Fem> a great circle, ending at −q. You need <b>720°<\u002Fb> to close the loop upstairs. That un-shrinkable 360° loop is why π₁(SO(3)) = ℤ/2 — and why slerp implementations must check the sign of q₀·q₁.<\u002Fp>\n      <div class=\"eq\">q = ( cos θ⁄2 , &nbsp;sin θ⁄2 · n̂ ) &nbsp;&nbsp; R(q) = R(−q)<\u002Fdiv>\n      <div class=\"ctrl\">\n        <div class=\"btns\"><button class=\"primary\" id=\"q-360\">▶ rotate 360°<\u002Fbutton><button class=\"primary\" id=\"q-720\">▶ rotate 720°<\u002Fbutton><button id=\"q-reset\">reset<\u002Fbutton><\u002Fdiv>\n        <div class=\"readout\"><span>θ = <b id=\"o-q-th\">0°<\u002Fb><\u002Fspan><span>q = <b id=\"o-q\">(+1.000, 0, 0, +0.000)<\u002Fb><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <svg id=\"s3\" viewBox=\"0 0 340 200\" style=\"width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px\"><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"view\" id=\"v-q\"><span class=\"tag\">PROBE IN SO(3) · CIRCLE = GREAT CIRCLE OF S³<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"border-bottom:none\">\n  <span class=\"kicker\">cheat sheet<\u002Fspan>\n  <h2>What to remember<\u002Fh2>\n  <div class=\"eq\" style=\"line-height:2\">\n    SO(3): curved, compact, non-abelian, ≅ ℝP³, π₁ = ℤ/2 &nbsp;<span class=\"c\">— attitudes<\u002Fspan><br>\n    𝔰𝔬(3): flat ℝ³ with the cross product as bracket &nbsp;<span class=\"c\">— angular velocities<\u002Fspan><br>\n    exp / log: Rodrigues ↔ axis–angle &nbsp;<span class=\"c\">— integrate gyros, define geodesics<\u002Fspan><br>\n    S³ (unit quaternions) double-covers SO(3) &nbsp;<span class=\"c\">— interpolate with slerp, mind the sign<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fmain>\n\n\n\n<script type=\"module\">\nconst { THREE, OrbitControls } = await (async () => {\n  const txt = async (u) => (await fetch(u)).text();\n  const blobURL = (s) => URL.createObjectURL(new Blob([s], { type: 'text/javascript' }));\n  const coreURL = blobURL(await txt(window.__resources.threeCore));\n  const threeURL = blobURL((await txt(window.__resources.threeModule)).split('./three.core.js').join(coreURL));\n  const ocSrc = (await txt(window.__resources.orbitControls))\n    .split(\"from 'three'\").join(\"from '\" + threeURL + \"'\")\n    .split('from \"three\"').join('from \"' + threeURL + '\"');\n  const THREE = await import(threeURL);\n  const { OrbitControls } = await import(blobURL(ocSrc));\n  return { THREE, OrbitControls };\n})();\n\nconst V3 = (x,y,z)=>new THREE.Vector3(x,y,z);\nconst AX = 0xff5c6c, AY = 0x69e07a, AZ = 0x58a6ff, ACC = 0xffb454, CY = 0x4fd6e0, MAG = 0xc65fd6;\nconst canvas = document.getElementById('gl');\nconst renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\n\n// ---------- shared builders ----------\nfunction makeLights(scene){\n  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1410, 1.1));\n  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3,5,4); scene.add(d);\n  const d2 = new THREE.DirectionalLight(0x88aaff, .6); d2.position.set(-4,-2,-3); scene.add(d2);\n}\nfunction arrow(dir, len, color, thick=0.02){\n  const g = new THREE.Group(); g.name='arrow';\n  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(thick,thick,1,12), new THREE.MeshStandardMaterial({color, roughness:.5}));\n  shaft.position.y = .5;\n  const head = new THREE.Mesh(new THREE.ConeGeometry(thick*3.2, thick*9, 16), shaft.material);\n  head.position.y = 1;\n  g.add(shaft, head);\n  g.userData.set = (d, l)=>{\n    const L = Math.max(l, 1e-6);\n    shaft.scale.set(1, L, 1); shaft.position.y = L/2; head.position.y = L;\n    g.quaternion.setFromUnitVectors(V3(0,1,0), d.clone().normalize());\n  };\n  g.userData.set(dir, len);\n  return g;\n}\nfunction triad(len=0.9, thick=0.025){\n  const g = new THREE.Group();\n  g.add(arrow(V3(1,0,0),len,AX,thick), arrow(V3(0,1,0),len,AY,thick), arrow(V3(0,0,1),len,AZ,thick));\n  return g;\n}\n// the \"probe\": a small satellite whose orientation is easy to read\nfunction probe(opacity=1){\n  const g = new THREE.Group();\n  const mat = (c)=>new THREE.MeshStandardMaterial({color:c, roughness:.45, metalness:.15, transparent:opacity<1, opacity});\n  const body = new THREE.Mesh(new THREE.BoxGeometry(.5,.42,.42), mat(0xc9d4e3)); body.name='bus'; g.add(body);\n  const pw = new THREE.Mesh(new THREE.BoxGeometry(.9,.02,.34), mat(0x2c66c4)); pw.position.x=.72; pw.name='panel+x'; g.add(pw);\n  const pe = pw.clone(); pe.position.x=-.72; g.add(pe);\n  const dish = new THREE.Mesh(new THREE.SphereGeometry(.16,24,16,0,Math.PI*2,0,Math.PI/2.4), mat(0xe8b04b));\n  dish.position.set(0,.3,0); dish.rotation.x=Math.PI; dish.name='dish'; g.add(dish);\n  const ant = new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.5,8), mat(0xd9a03a));\n  ant.position.set(0,.5,0); ant.name='antenna'; g.add(ant);\n  const nose = new THREE.Mesh(new THREE.ConeGeometry(.09,.2,16), mat(0xd35460));\n  nose.rotation.z = -Math.PI/2; nose.position.set(.35,0,-.12); nose.name='nose'; g.add(nose);\n  g.add(triad(.85, .02));\n  return g;\n}\nfunction grid(scene, y=-1.05){\n  const gh = new THREE.GridHelper(6, 12, 0x2a3a4e, 0x1c2432);\n  gh.material.transparent = true; gh.material.opacity = .5; gh.position.y = y; scene.add(gh);\n}\n\n// ---------- multi-view plumbing ----------\nconst views = [];\nfunction makeView(elId, {camPos=[2.6,1.8,3.2], orbit=true}={}){\n  const el = document.getElementById(elId);\n  const scene = new THREE.Scene();\n  const camera = new THREE.PerspectiveCamera(40, 1, .1, 100);\n  camera.position.set(...camPos); camera.lookAt(0,0,0);\n  makeLights(scene);\n  let controls = null;\n  if(orbit){ controls = new OrbitControls(camera, el); controls.enableDamping = true; controls.enablePan = false; controls.enableZoom = false; }\n  const v = {el, scene, camera, controls, update:null};\n  views.push(v); return v;\n}\nfunction render(time){\n  const t = time*0.001;\n  renderer.setSize(innerWidth, innerHeight, false);\n  renderer.setScissorTest(true);\n  for(const v of views){\n    const r = v.el.getBoundingClientRect();\n    if(r.bottom < 0 || r.top > innerHeight || r.right < 0 || r.left > innerWidth) continue;\n    const w = r.width, h = r.height;\n    const left = r.left, bottom = innerHeight - r.bottom;\n    renderer.setViewport(left, bottom, w, h); renderer.setScissor(left, bottom, w, h);\n    v.camera.aspect = w/h; v.camera.updateProjectionMatrix();\n    v.controls && v.controls.update();\n    v.update && v.update(t);\n    renderer.render(v.scene, v.camera);\n  }\n  requestAnimationFrame(render);\n}\n\n// ---------- math helpers ----------\nconst fmt = (x,d=3)=>{ const s = x.toFixed(d); return (x>=0?'+':'')+s; };\nfunction matSpans(id){\n  const el = document.getElementById(id); const spans=[];\n  for(let i=0;i<9;i++){ const s=document.createElement('span'); el.appendChild(s); spans.push(s); }\n  return spans;\n}\nfunction setMat(spans, get){ // get(r,c)\n  for(let r=0;r<3;r++)for(let c=0;c<3;c++){\n    const v = get(r,c); const s = spans[r*3+c];\n    s.textContent = fmt(v); s.className = Math.abs(v)<0.0005 ? 'z':'';\n  }\n}\nconst m4 = new THREE.Matrix4();\nconst qToGet = (q)=>{ m4.makeRotationFromQuaternion(q); const e=m4.elements; return (r,c)=>e[c*4+r]; };\nfunction expQ(w, dt=1){ // exp of w*dt as quaternion\n  const th = w.length()*dt;\n  if(th < 1e-9) return new THREE.Quaternion();\n  return new THREE.Quaternion().setFromAxisAngle(w.clone().normalize(), th);\n}\nconst easeIO = s => s<0? 0 : s>1? 1 : s*s*(3-2*s);\n\n// =========================================================\n// 01 · GROUP ACTION\n{\n  const v = makeView('v-act', {orbit:false});\n  grid(v.scene);\n  const p = probe(); v.scene.add(p);\n  const spans = matSpans('m-act');\n  const detEl = document.getElementById('det-act'), orthEl = document.getElementById('orth-act');\n  // trackball drag: compose ΔR·R\n  let dragging=false, px=0, py=0;\n  v.el.addEventListener('pointerdown', e=>{dragging=true; px=e.clientX; py=e.clientY; v.el.setPointerCapture(e.pointerId);});\n  v.el.addEventListener('pointermove', e=>{\n    if(!dragging) return;\n    const dx=(e.clientX-px)*0.011, dy=(e.clientY-py)*0.011; px=e.clientX; py=e.clientY;\n    const dq = new THREE.Quaternion().setFromAxisAngle(V3(0,1,0), dx)\n      .multiply(new THREE.Quaternion().setFromAxisAngle(V3(1,0,0), dy));\n    p.quaternion.premultiply(dq);\n  });\n  addEventListener('pointerup', ()=>dragging=false);\n  // buttons — animate a 90° pre-compose\n  let anim = null;\n  document.querySelectorAll('#act [data-pre]').forEach(b=>b.addEventListener('click', ()=>{\n    const k = b.dataset.pre;\n    if(k==='reset'){ p.quaternion.identity(); return; }\n    if(k==='inv'){ p.quaternion.invert(); return; }\n    const ax = k==='x'?V3(1,0,0):k==='y'?V3(0,1,0):V3(0,0,1);\n    anim = {q0:p.quaternion.clone(), ax, s:0};\n  }));\n  v.update = (t)=>{\n    if(anim){ anim.s = Math.min(1, anim.s + 0.035);\n      const dq = new THREE.Quaternion().setFromAxisAngle(anim.ax, easeIO(anim.s)*Math.PI/2);\n      p.quaternion.copy(anim.q0).premultiply(dq);\n      if(anim.s>=1) anim=null;\n    }\n    const g = qToGet(p.quaternion); setMat(spans, g);\n    detEl.textContent = '1.000'; orthEl.textContent = '0.000'; // exact by construction\n  };\n}\n\n// =========================================================\n// 02 · NON-COMMUTATIVITY\n{\n  const v = makeView('v-nc', {camPos:[0,2.2,5.6]});\n  grid(v.scene);\n  const L = probe(), R = probe();\n  L.position.x = -1.5; R.position.x = 1.5; v.scene.add(L, R);\n  let t0 = -1;\n  const seq = (p, first, second, s)=>{ // s in [0,2]\n    const q = new THREE.Quaternion();\n    const a1 = easeIO(Math.min(s,1))*Math.PI/2, a2 = easeIO(s-1)*Math.PI/2;\n    q.premultiply(new THREE.Quaternion().setFromAxisAngle(first, a1));\n    q.premultiply(new THREE.Quaternion().setFromAxisAngle(second, a2));\n    p.quaternion.copy(q);\n  };\n  document.getElementById('nc-play').addEventListener('click', ()=>{ t0 = performance.now()*0.001; });\n  document.getElementById('nc-reset').addEventListener('click', ()=>{ t0=-1; L.quaternion.identity(); R.quaternion.identity(); });\n  v.update = ()=>{\n    if(t0<0) return;\n    const s = Math.min(2, (performance.now()*0.001 - t0) * 0.9);\n    seq(L, V3(1,0,0), V3(0,1,0), s);   // Rx then Ry  → Ry·Rx\n    seq(R, V3(0,1,0), V3(1,0,0), s);   // Ry then Rx  → Rx·Ry\n  };\n}\n\n// =========================================================\n// 03 · BALL MODEL\n{\n  const v = makeView('v-ball', {camPos:[2.2,1.6,4.6]});\n  const ball = new THREE.Mesh(new THREE.SphereGeometry(1.35, 48, 32),\n    new THREE.MeshStandardMaterial({color:0x4fd6e0, transparent:true, opacity:0.07, roughness:.9, side:THREE.DoubleSide}));\n  const wire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.SphereGeometry(1.35, 18, 12)),\n    new THREE.LineBasicMaterial({color:0x2a3a4e, transparent:true, opacity:.7}));\n  const ballG = new THREE.Group(); ballG.position.x = -1.35; ballG.add(ball, wire);\n  const marker = new THREE.Mesh(new THREE.SphereGeometry(.06,16,12), new THREE.MeshStandardMaterial({color:ACC, emissive:ACC, emissiveIntensity:.6}));\n  const anti = marker.clone(); anti.material = new THREE.MeshStandardMaterial({color:MAG, emissive:MAG, emissiveIntensity:.6});\n  const stem = new THREE.Line(new THREE.BufferGeometry().setFromPoints([V3(0,0,0), V3(0,0,0)]), new THREE.LineBasicMaterial({color:ACC}));\n  ballG.add(marker, anti, stem);\n  const p = probe(); p.scale.setScalar(.9); p.position.x = 1.55; \n  v.scene.add(ballG, p);\n  const az = document.getElementById('b-az'), el = document.getElementById('b-el'), th = document.getElementById('b-th');\n  let loop = -1;\n  const apply = ()=>{\n    const A = az.value*Math.PI/180, E = el.value*Math.PI/180, T = th.value*Math.PI/180;\n    document.getElementById('o-b-az').textContent = az.value+'°';\n    document.getElementById('o-b-el').textContent = el.value+'°';\n    document.getElementById('o-b-th').textContent = th.value+'°';\n    const n = V3(Math.cos(E)*Math.cos(A), Math.sin(E), -Math.cos(E)*Math.sin(A));\n    const r = 1.35 * (T/Math.PI);\n    marker.position.copy(n).multiplyScalar(r);\n    anti.position.copy(n).multiplyScalar(-r);\n    anti.visible = T > Math.PI - 0.02;\n    stem.geometry.setFromPoints([V3(0,0,0), marker.position.clone()]);\n    p.quaternion.setFromAxisAngle(n, T);\n  };\n  [az,el,th].forEach(s=>s.addEventListener('input', ()=>{loop=-1; apply();}));\n  apply();\n  document.getElementById('b-loop').addEventListener('click', ()=>{ loop = performance.now()*0.001; });\n  v.update = ()=>{\n    if(loop<0) return;\n    const s = (performance.now()*0.001 - loop) * 0.45; // full 2π in ~3.5s... wraps\n    if(s >= 2){ loop = -1; return; }\n    let T = s*Math.PI; // 0..2π\n    if(T <= Math.PI){ th.value = T*180/Math.PI; }\n    else { // reappear from the antipode: equivalent angle 2π−T about −n\n      th.value = (2*Math.PI - T)*180/Math.PI;\n      az.value = ((+az.value+180+180)%360)-180; // flip axis... (only visually via marker)\n    }\n    apply();\n    if(T>Math.PI){ az.value = ((+az.value-180+180+360)%360)-180; } // restore for next frame\n  };\n}\n\n// =========================================================\n// 04 · so(3) SKEW / ANGULAR VELOCITY\n{\n  const v = makeView('v-so3', {camPos:[2.8,2,3.4]});\n  grid(v.scene);\n  const p = probe(); v.scene.add(p);\n  const wArrow = arrow(V3(0,1,0), 1, MAG, .026); v.scene.add(wArrow);\n  const spans = matSpans('m-hat');\n  // sample points on a shell around the probe, velocity arrows glued in world space\n  const pts = [V3(.85,.2,.3), V3(-.7,.45,-.35), V3(.15,-.75,.55), V3(-.3,.3,.8), V3(.5,.6,-.6)].map(r=>{\n    const dot = new THREE.Mesh(new THREE.SphereGeometry(.035,10,8), new THREE.MeshStandardMaterial({color:0xe7ecf3}));\n    const a = arrow(V3(0,1,0), .3, CY, .014);\n    v.scene.add(dot, a);\n    return {r, dot, a};\n  });\n  const sliders = ['w-x','w-y','w-z'].map(id=>document.getElementById(id));\n  const outs = ['o-w-x','o-w-y','o-w-z'].map(id=>document.getElementById(id));\n  const nOut = document.getElementById('o-w-n');\n  const w = V3(0.6,1.2,0);\n  const upd = ()=>{\n    w.set(+sliders[0].value, +sliders[1].value, +sliders[2].value);\n    outs.forEach((o,i)=>o.textContent = (+sliders[i].value).toFixed(2));\n    nOut.textContent = w.length().toFixed(2);\n    setMat(spans, (r,c)=>[[0,-w.z,w.y],[w.z,0,-w.x],[-w.y,w.x,0]][r][c]);\n    wArrow.visible = w.length()>1e-3;\n    wArrow.userData.set(w.length()>1e-3? w.clone().normalize() : V3(0,1,0), w.length()*0.75);\n  };\n  sliders.forEach(s=>s.addEventListener('input', upd)); upd();\n  let last = 0;\n  v.update = (t)=>{\n    const dt = Math.min(t-last, .05); last = t;\n    p.quaternion.premultiply(expQ(w, dt));\n    for(const {r, dot, a} of pts){\n      const rw = r.clone().applyQuaternion(p.quaternion);\n      dot.position.copy(rw);\n      const vel = w.clone().cross(rw);\n      a.position.copy(rw);\n      a.visible = vel.length()>1e-3;\n      a.userData.set(vel.length()>1e-3? vel.clone().normalize(): V3(0,1,0), vel.length()*0.42);\n    }\n  };\n}\n\n// =========================================================\n// 05 · EXPONENTIAL MAP\n{\n  const v = makeView('v-exp');\n  grid(v.scene);\n  const p = probe(); v.scene.add(p);\n  let axis = V3(.4,1,.25).normalize();\n  const axArrow = arrow(axis, 1.5, MAG, .02); axArrow.position.copy(axis.clone().multiplyScalar(-0.75)); v.scene.add(axArrow);\n  const spans = matSpans('m-exp');\n  const th = document.getElementById('e-th'), out = document.getElementById('o-e-th');\n  const tipLocal = V3(0,.75,0); // antenna tip\n  const N = 361; const traceGeo = new THREE.BufferGeometry(); const posArr = new Float32Array(N*3);\n  traceGeo.setAttribute('position', new THREE.BufferAttribute(posArr,3)); traceGeo.setDrawRange(0,0);\n  const trace = new THREE.Line(traceGeo, new THREE.LineBasicMaterial({color:ACC})); v.scene.add(trace);\n  let playing = false;\n  const apply = ()=>{\n    const T = th.value*Math.PI/180; out.textContent = Math.round(th.value)+'°';\n    p.quaternion.setFromAxisAngle(axis, T);\n    setMat(spans, qToGet(p.quaternion));\n    const n = Math.round(+th.value)+1;\n    for(let i=0;i<n;i++){\n      const q = new THREE.Quaternion().setFromAxisAngle(axis, i*Math.PI/180);\n      const pt = tipLocal.clone().applyQuaternion(q);\n      posArr[i*3]=pt.x; posArr[i*3+1]=pt.y; posArr[i*3+2]=pt.z;\n    }\n    traceGeo.attributes.position.needsUpdate = true; traceGeo.setDrawRange(0,n);\n  };\n  th.addEventListener('input', ()=>{playing=false; apply();}); apply();\n  document.getElementById('e-play').addEventListener('click', ()=>{ if(+th.value>=360) th.value=0; playing=true; });\n  document.getElementById('e-rand').addEventListener('click', ()=>{\n    axis = V3(Math.random()*2-1, Math.random()*2-1, Math.random()*2-1).normalize();\n    axArrow.userData.set(axis, 1.5); axArrow.position.copy(axis.clone().multiplyScalar(-0.75));\n    apply();\n  });\n  v.update = ()=>{ if(playing){ th.value = +th.value + 1.2; if(+th.value>=360){th.value=360; playing=false;} apply(); } };\n}\n\n// =========================================================\n// 06 · TANGENT SPACE (spatial vs body)\n{\n  const v = makeView('v-tan', {camPos:[2.6,2,3.6]});\n  grid(v.scene);\n  const p = probe(); v.scene.add(p);\n  const aS = arrow(V3(0,1,0), 1, CY, .026); v.scene.add(aS);\n  const aB = arrow(V3(0,1,0), 1, ACC, .026); p.add(aB); // glued to body\n  const wsEl = document.getElementById('o-ws'), wbEl = document.getElementById('o-wb');\n  const Rof = (t)=>{\n    const q = new THREE.Quaternion().setFromAxisAngle(V3(0,0,1), .8*t)\n      .multiply(new THREE.Quaternion().setFromAxisAngle(V3(1,0,0), .9*Math.sin(t)));\n    return q;\n  };\n  v.update = (t)=>{\n    const q = Rof(t); p.quaternion.copy(q);\n    // spatial omega by analytic-ish finite difference\n    const h = 1e-3, q2 = Rof(t+h);\n    const dq = q2.clone().multiply(q.clone().invert()); // ΔR = R(t+h)R(t)ᵀ\n    let ang = 2*Math.acos(Math.min(1,Math.abs(dq.w)));\n    const s = Math.sqrt(Math.max(1e-12, 1-dq.w*dq.w));\n    const axis = V3(dq.x/s, dq.y/s, dq.z/s).multiplyScalar(Math.sign(dq.w||1));\n    const ws = axis.multiplyScalar(ang/h);\n    const wb = ws.clone().applyQuaternion(q.clone().invert());\n    aS.userData.set(ws.clone().normalize(), ws.length()*.55);\n    aB.userData.set(wb.clone().normalize(), wb.length()*.55);\n    wsEl.textContent = `(${ws.x.toFixed(2)}, ${ws.y.toFixed(2)}, ${ws.z.toFixed(2)})`;\n    wbEl.textContent = `(${wb.x.toFixed(2)}, ${wb.y.toFixed(2)}, ${wb.z.toFixed(2)})`;\n  };\n}\n\n// =========================================================\n// 07 · SLERP vs LERP\n{\n  const v = makeView('v-slerp', {camPos:[2.4,1.9,4.4]});\n  grid(v.scene);\n  const q0 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.2,-0.4,0.1));\n  const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(1.9,1.2,-0.7));\n  const g0 = probe(.16), g1 = probe(.16); g0.quaternion.copy(q0); g1.quaternion.copy(q1); v.scene.add(g0,g1);\n  const pS = probe(); v.scene.add(pS);            // slerp probe\n  const pL = probe(); v.scene.add(pL);            // lerp probe\n  pL.matrixAutoUpdate = false;\n  const sEl = document.getElementById('s-s'), sOut = document.getElementById('o-s-s'), detEl = document.getElementById('o-det-lerp');\n  // geodesic trace of antenna tip\n  const tip = V3(0,.75,0), pts=[];\n  for(let i=0;i<=80;i++){ const q = q0.clone().slerp(q1, i/80); pts.push(tip.clone().applyQuaternion(q)); }\n  v.scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:CY})));\n  let mode = 'slerp', playing = false;\n  const modeBtns = {['s-slerp']:'slerp', ['s-lerp']:'lerp', ['s-both']:'both'};\n  for(const [id,m] of Object.entries(modeBtns)){\n    document.getElementById(id).addEventListener('click', (e)=>{\n      mode = m;\n      Object.keys(modeBtns).forEach(k=>document.getElementById(k).classList.toggle('on', k===id));\n      apply();\n    });\n  }\n  const M0 = new THREE.Matrix4().makeRotationFromQuaternion(q0);\n  const M1 = new THREE.Matrix4().makeRotationFromQuaternion(q1);\n  const det3 = (m)=>{ const e=m.elements;\n    return e[0]*(e[5]*e[10]-e[6]*e[9]) - e[4]*(e[1]*e[10]-e[2]*e[9]) + e[8]*(e[1]*e[6]-e[2]*e[5]); };\n  const apply = ()=>{\n    const s = +sEl.value; sOut.textContent = s.toFixed(2);\n    pS.visible = mode!=='lerp'; pL.visible = mode!=='slerp';\n    pS.quaternion.copy(q0).slerp(q1, s);\n    const M = new THREE.Matrix4();\n    for(let i=0;i<16;i++) M.elements[i] = (1-s)*M0.elements[i] + s*M1.elements[i];\n    M.elements[15]=1;\n    pL.matrix.copy(M);\n    detEl.textContent = det3(M).toFixed(3);\n    if(mode==='both'){ pS.position.x=-1.1; pL.matrix.setPosition(1.1,0,0); }\n    else { pS.position.x=0; pL.matrix.setPosition(0,0,0); }\n  };\n  sEl.addEventListener('input', ()=>{playing=false; apply();}); apply();\n  document.getElementById('s-play').addEventListener('click', ()=>{ sEl.value=0; playing=true; });\n  v.update = ()=>{ if(playing){ sEl.value = +sEl.value + 0.006; if(+sEl.value>=1){sEl.value=1; playing=false;} apply(); } };\n}\n\n// =========================================================\n// 08 · COMMUTATOR\n{\n  const v = makeView('v-brk', {camPos:[2.6,2.2,3.4]});\n  grid(v.scene);\n  const ghost = probe(.14); v.scene.add(ghost);\n  const p = probe(); v.scene.add(p);\n  const eps = document.getElementById('k-eps'), out = document.getElementById('o-k-eps');\n  const res = document.getElementById('o-k-res'), meas = document.getElementById('o-k-meas');\n  const upd = ()=>{ const e = eps.value*Math.PI/180;\n    out.textContent = eps.value+'°'; res.textContent = (e*e*180/Math.PI).toFixed(1)+'°'; meas.textContent='—'; };\n  eps.addEventListener('input', upd); upd();\n  let t0=-1;\n  document.getElementById('k-play').addEventListener('click', ()=>{ t0 = performance.now()*0.001; p.quaternion.identity(); });\n  v.update = ()=>{\n    if(t0<0) return;\n    const e = eps.value*Math.PI/180;\n    const s = (performance.now()*0.001 - t0) * 1.1; // 4 phases of 1 unit\n    const steps = [[V3(1,0,0), e],[V3(0,1,0), e],[V3(1,0,0), -e],[V3(0,1,0), -e]];\n    const q = new THREE.Quaternion();\n    for(let i=0;i<4;i++){\n      const f = easeIO(s - i);\n      if(f<=0) break;\n      q.premultiply(new THREE.Quaternion().setFromAxisAngle(steps[i][0], steps[i][1]*f));\n    }\n    p.quaternion.copy(q);\n    if(s>=4){ t0=-1;\n      const ang = 2*Math.acos(Math.min(1,Math.abs(q.w)));\n      meas.textContent = (ang*180/Math.PI).toFixed(1)+'° about ('+q.x.toFixed(2)+', '+q.y.toFixed(2)+', '+q.z.toFixed(2)+')·sin';\n      const sn = Math.sqrt(Math.max(1e-12,1-q.w*q.w));\n      meas.textContent = (ang*180/Math.PI).toFixed(1)+'°, axis ('+(q.x/sn).toFixed(2)+', '+(q.y/sn).toFixed(2)+', '+(q.z/sn).toFixed(2)+')';\n    }\n  };\n}\n\n// =========================================================\n// 09 · DOUBLE COVER\n{\n  const v = makeView('v-q', {camPos:[2.4,1.7,3.4]});\n  grid(v.scene);\n  const p = probe(); v.scene.add(p);\n  const axisA = arrow(V3(0,0,1), 1.4, MAG, .018); axisA.position.z = -0.7; v.scene.add(axisA);\n  // SVG great circle\n  const svg = document.getElementById('s3');\n  const cx=170, cy=100, R=72;\n  svg.innerHTML = `\n    <circle cx=\"${cx}\" cy=\"${cy}\" r=\"${R}\" fill=\"none\" stroke=\"#2a3a4e\" stroke-width=\"1.5\"/>\n    <circle cx=\"${cx+R}\" cy=\"${cy}\" r=\"4\" fill=\"#4fd6e0\"/>\n    <circle cx=\"${cx-R}\" cy=\"${cy}\" r=\"4\" fill=\"#c65fd6\"/>\n    <text x=\"${cx+R+10}\" y=\"${cy+4}\" font-size=\"12\" fill=\"#4fd6e0\">+q (θ=0)<\u002Ftext>\n    <text x=\"${cx-R-10}\" y=\"${cy+4}\" font-size=\"12\" fill=\"#c65fd6\" text-anchor=\"end\">−q (θ=2π)<\u002Ftext>\n    <text x=\"${cx}\" y=\"${cy-R-8}\" font-size=\"11\" fill=\"#8b98ab\" text-anchor=\"middle\">great circle of S³ · marker moves at θ/2<\u002Ftext>\n    <path id=\"s3trail\" fill=\"none\" stroke=\"#ffb454\" stroke-width=\"2.5\"/>\n    <circle id=\"s3m\" cx=\"${cx+R}\" cy=\"${cy}\" r=\"6\" fill=\"#ffb454\" stroke=\"#0b0e13\" stroke-width=\"2\"/>`;\n  const mEl = svg.querySelector('#s3m'), trail = svg.querySelector('#s3trail');\n  const thOut = document.getElementById('o-q-th'), qOut = document.getElementById('o-q');\n  let theta = 0, target = 0;\n  const setTheta = (th)=>{\n    theta = th;\n    p.quaternion.setFromAxisAngle(V3(0,0,1), theta);\n    const half = theta/2;\n    const x = cx + R*Math.cos(half), y = cy - R*Math.sin(half);\n    mEl.setAttribute('cx', x); mEl.setAttribute('cy', y);\n    // trail arc\n    let d = `M ${cx+R} ${cy}`;\n    const n = Math.max(2, Math.round(half/0.05));\n    for(let i=1;i<=n;i++){ const a = half*i/n; d += ` L ${cx + R*Math.cos(a)} ${cy - R*Math.sin(a)}`; }\n    trail.setAttribute('d', half>0.01? d : '');\n    thOut.textContent = Math.round(theta*180/Math.PI)+'°';\n    qOut.textContent = `(${fmt(Math.cos(half))}, 0, 0, ${fmt(Math.sin(half))})`;\n  };\n  setTheta(0);\n  document.getElementById('q-360').addEventListener('click', ()=>{ target = theta + 2*Math.PI; });\n  document.getElementById('q-720').addEventListener('click', ()=>{ target = theta + 4*Math.PI; });\n  document.getElementById('q-reset').addEventListener('click', ()=>{ target = 0; setTheta(0); });\n  v.update = ()=>{\n    if(Math.abs(target-theta) > 1e-4){\n      const d = Math.sign(target-theta)*Math.min(Math.abs(target-theta), 0.045);\n      setTheta((theta+d) % (4*Math.PI+1e-9));\n      if(Math.abs(target-theta)<=1e-4 && Math.abs(theta - 4*Math.PI) < 0.05){ setTheta(0); target=0; }\n    }\n  };\n}\n\nrequestAnimationFrame(render);\naddEventListener('resize', ()=>renderer.setSize(innerWidth, innerHeight, false));\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
