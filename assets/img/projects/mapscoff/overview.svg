<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Safe cross-embodiment grasp-compliance calibration</title>
  <desc id="desc">A flow diagram from a new robot hand and a small set of wrench-displacement probes to a passive compliance matrix and settling offset.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="48" y="44" width="1104" height="587" rx="24" fill="#fff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="92" y="112" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Safe Cross-Embodiment Grasp-Compliance Calibration</text>
  <text x="92" y="154" fill="#64748b" font-family="Arial, sans-serif" font-size="24">Few-shot estimation of passive grasp compliance for an unseen robot hand</text>

  <g transform="translate(92 225)">
    <rect width="250" height="245" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <text x="28" y="48" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="24" font-weight="700">UNSEEN HAND</text>
    <rect x="54" y="76" width="30" height="104" rx="14" fill="#1d4ed8"/>
    <rect x="110" y="58" width="30" height="122" rx="14" fill="#1d4ed8"/>
    <rect x="166" y="76" width="30" height="104" rx="14" fill="#1d4ed8"/>
    <rect x="54" y="190" width="142" height="28" rx="12" fill="#60a5fa"/>
  </g>

  <path d="M370 347h105" stroke="#94a3b8" stroke-width="5"/>
  <path d="m463 334 18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="5"/>

  <g transform="translate(500 225)">
    <rect width="250" height="245" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="26" y="48" fill="#0f172a" font-family="Arial, sans-serif" font-size="23" font-weight="700">K = 20 PROBES</text>
    <text x="26" y="91" fill="#64748b" font-family="Arial, sans-serif" font-size="21">applied wrench</text>
    <text x="26" y="128" fill="#1d4ed8" font-family="monospace" font-size="26">w ∈ R⁶</text>
    <path d="M30 158h185" stroke="#cbd5e1" stroke-width="3"/>
    <text x="26" y="195" fill="#64748b" font-family="Arial, sans-serif" font-size="21">measured motion</text>
    <text x="26" y="228" fill="#1d4ed8" font-family="monospace" font-size="26">Δx ∈ R⁶</text>
  </g>

  <path d="M778 347h72" stroke="#94a3b8" stroke-width="5"/>
  <path d="m838 334 18 13-18 13" fill="none" stroke="#94a3b8" stroke-width="5"/>

  <g transform="translate(875 225)">
    <rect width="233" height="245" rx="18" fill="#1d4ed8"/>
    <text x="116.5" y="47" fill="#dbeafe" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">SAFE MODEL</text>
    <text x="116.5" y="104" fill="#fff" font-family="monospace" font-size="25" text-anchor="middle">Δx = Cw + b</text>
    <text x="116.5" y="154" fill="#fff" font-family="monospace" font-size="28" font-weight="700" text-anchor="middle">C ⪰ 0</text>
    <path d="M30 176h173" stroke="#60a5fa" stroke-width="2" opacity="0.7"/>
    <text x="116.5" y="207" fill="#dbeafe" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">passive by construction</text>
  </g>

  <text x="92" y="554" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700">Frozen cross-hand prior + MAP estimation + gated settling offset</text>
  <text x="92" y="590" fill="#64748b" font-family="Arial, sans-serif" font-size="22">Accurate adaptation for a new embodiment without sacrificing controller safety.</text>
</svg>
